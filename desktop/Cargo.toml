[package]
name = "hahn-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Hahn as a desktop application"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
hahn = { path = "../server" }
iana-time-zone = "0.1"
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["net"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
