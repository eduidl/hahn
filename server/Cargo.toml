[package]
name = "hahn"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1"
arrow = { version = "58", default-features = false }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
csv = "1"
mcap = "0.25"
mcapdecode = { path = "../../../../repos/eduidl/mcapdecode-rs/mcapdecode/mcapdecode", features = ["rawjson"] }
memmap2 = "0.9"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }

[dependencies.parquet]
version = "58"
default-features = false
features = [
    "arrow",
    "snap",
    "zstd",
    "lz4",
    "flate2-zlib-rs",
    "brotli",
]

[dev-dependencies]
prost = "0.14"
prost-types = "0.14"
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

