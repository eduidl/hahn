[package]
name = "hahn"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
mcap = "0.25"
mcapdecode = { path = "../../../repos/eduidl/mcapdecode-rs/mcapdecode/mcapdecode" }
mcapdecode-ros2-common = { path = "../../../repos/eduidl/mcapdecode-rs/mcapdecode/mcapdecode-ros2-common" }
mcapdecode-ros2idl = { path = "../../../repos/eduidl/mcapdecode-rs/mcapdecode/mcapdecode-ros2idl" }
mcapdecode-ros2msg = { path = "../../../repos/eduidl/mcapdecode-rs/mcapdecode/mcapdecode-ros2msg" }
memmap2 = "0.9"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

