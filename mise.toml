# Versions the project is developed and checked with. README.md states the minimums.
[tools]
node = "26.13.0"
rust = "1.97.1"

[tasks."client:install"]
description = "Install client dependencies"
run = "npm --prefix client ci"
# Skipped while node_modules matches the lockfile.
sources = ["client/package-lock.json"]
outputs = ["client/node_modules/.package-lock.json"]

[tasks."client:dev"]
description = "Run the client dev server; /api goes to port 3000"
run = "npm --prefix client run dev"

[tasks."client:build"]
description = "Build the client"
run = "npm --prefix client run build"

[tasks."desktop:install"]
description = "Install the desktop app's tools"
run = "npm --prefix desktop ci"
sources = ["desktop/package-lock.json"]
outputs = ["desktop/node_modules/.package-lock.json"]

[tasks."desktop:dev"]
description = "Run the desktop app with the client's development server; pass a recording to open it"
depends = ["client:install", "desktop:install"]
run = "npm --prefix desktop run dev --"

[tasks."desktop:build"]
description = "Build the desktop app's installers"
depends = ["client:install", "desktop:install"]
run = "npm --prefix desktop run build"

[tasks.format]
description = "Format the client"
run = "npm --prefix client run format"

[tasks."test:server"]
description = "Run the server tests"
run = "cargo test --manifest-path server/Cargo.toml --locked"

[tasks."test:client"]
description = "Run the client tests and check the generated API types"
run = "npm --prefix client test"

[tasks."test:visual"]
description = "Compare screenshots of the client with the references in test/visual"
run = "npm --prefix client run test:visual"

[tasks.e2e]
description = "Drive the built client in a browser against synthetic recordings"
run = "scripts/e2e.sh"

[tasks.conformance]
description = "Run the conformance tests against synthetic recordings"
run = "scripts/conformance.sh"

[tasks.check]
description = "Run the checks in DEVELOPMENT.md"
depends = ["test:server", "test:client", "test:visual", "client:build", "format:check", "lint", "conformance", "e2e"]

[tasks.lint]
description = "Lint the client"
run = "npm --prefix client run lint"

[tasks."format:check"]
description = "Check the client formatting"
run = "npm --prefix client run format:check"
